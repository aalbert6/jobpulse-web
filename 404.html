<title>JobsPulse — page not found</title>
<!-- GitHub Pages serves this for any unknown path (SEO-PLAN §C). -->
<style>
  :root{ --blue:#0b5cad; --ink:#14202b; --muted:#5a6b7b; --bg:#f4f6f9; --line:#e3e8ee; }
  @media (prefers-color-scheme: dark){ :root{ --ink:#eef3f8; --muted:#9fb0c0; --bg:#0e151c; --line:#26323f; --blue:#3a90e0; } }
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;line-height:1.55;}
  .wrap{max-width:560px;margin:0 auto;padding:18vh 22px 60px;text-align:center}
  .dot{width:64px;height:64px;border-radius:50%;margin:0 auto 26px;background:radial-gradient(circle at 38% 34%, color-mix(in srgb,var(--blue) 82%, white) 0%, var(--blue) 60%);box-shadow:0 0 0 10px color-mix(in srgb,var(--blue) 14%,transparent)}
  h1{font-size:28px;letter-spacing:-.02em;margin:0 0 8px} p{color:var(--muted);margin:0 0 22px}
  a.b{display:inline-block;margin:4px;padding:10px 16px;border-radius:10px;border:1px solid var(--line);color:var(--ink);text-decoration:none;font-weight:600}
  a.b.p{background:var(--blue);border-color:var(--blue);color:#fff}
  #lang-switch{margin-top:30px;font:inherit;font-size:13px;color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:8px;padding:5px 8px}
</style>
</head>
<body>
<div class="wrap">
  <div class="dot"></div>
  <h1 data-i18n="nf.h1">Dottie looked everywhere.</h1>
  <p data-i18n="nf.p">This page doesn't exist — maybe the link is old. Here's where you probably wanted to go:</p>
  <a class="b p" href="/" data-i18n="nf.home">JobsPulse home</a><a class="b" href="/dashboard/" data-i18n="nav.dashboard">Dashboard</a><a class="b" href="/how-it-works/" data-i18n="nav.how">How it works</a>
  <div><select id="lang-switch" aria-label="Language"></select></div>
</div>
<script src="/assets/i18n.js" defer></script>
</body>
</html>
