<!doctype html>
<html lang="en" data-i18n-title="db.title">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="robots" content="noindex">
<title>JobsPulse — update your info</title>
<!--
  DRAFT (2026-09-19) — "Dottie in edit mode". NOT deployed until Albert approves.

  Session-gated (magic link). Dottie greets the user with everything on file as a list of
  question → answer rows. Tapping a row expands it IN PLACE into the same control the intake
  uses (chips, town suggestions, cleaned lists, custom salary); save writes that one column via
  RLS (own row by primary key) and the row collapses with a "saved" tick; Dottie slides next to
  the row being edited and pulses while saving. Email language is editable; the CV can be
  replaced (through the `profile` edge function — the bucket is private). Seven languages.
-->
<style>
  :root{ --blue:#0b5cad; --blue-d:#094a8c; --ink:#14202b; --muted:#5a6b7b; --bg:#f4f6f9; --card:#fff; --line:#e3e8ee; --green:#1a7f37; --err:#b3261e; }
  @media (prefers-color-scheme: dark){ :root{ --ink:#eef3f8; --muted:#9fb0c0; --bg:#0e151c; --card:#161f29; --line:#26323f; --blue:#3a90e0; --blue-d:#2f7fca; } }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased;}
  a{color:var(--blue)}
  header{position:sticky;top:0;z-index:6;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:space-between;padding:14px 20px;}
  .brand{font-weight:800;font-size:16px;color:var(--blue);text-decoration:none}
  .hdr{display:flex;gap:8px;align-items:center}
  #lang-switch,.hbtn{font:inherit;font-size:12px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;text-decoration:none}

  .orb{--s:min(70vmin,560px);position:fixed;left:50%;top:50%;width:var(--s);height:var(--s);z-index:3;pointer-events:none;
    transform:translate(-50%,-50%) scale(0);transition:transform .8s cubic-bezier(.2,.8,.2,1);}
  .core{position:relative;overflow:hidden;width:100%;height:100%;border-radius:50%;
    background:radial-gradient(circle at 38% 34%, color-mix(in srgb,var(--blue) 82%, white) 0%, var(--blue) 45%, var(--blue-d) 100%);
    box-shadow:0 0 0 calc(var(--s)*.05) color-mix(in srgb,var(--blue) 12%,transparent), 0 14px 40px color-mix(in srgb,var(--blue) 30%,transparent);
    animation:breathe 4.5s ease-in-out infinite;}
  .core::after{content:"";position:absolute;inset:0;border-radius:50%;opacity:0;background:radial-gradient(circle at 80% 50%, rgba(255,255,255,.55) 0%, rgba(255,255,255,.18) 18%, transparent 38%);transition:opacity .4s}
  .thinking .core{animation:heartbeat 1.15s ease-in-out infinite} .thinking .core::after{opacity:1;animation:orbit 1.4s linear infinite}
  .core.happy{animation:pop .9s cubic-bezier(.2,.9,.3,1.35) 1, breathe 4.5s ease-in-out .9s infinite}
  @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
  @keyframes heartbeat{0%{transform:scale(1)}18%{transform:scale(1.07)}36%{transform:scale(.98)}54%{transform:scale(1.05)}100%{transform:scale(1)}}
  @keyframes orbit{to{transform:rotate(360deg)}}
  @keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.25)}100%{transform:scale(1)}}
  @media (prefers-reduced-motion: reduce){ .core,.core::after{animation:none !important} .orb{transition:none} }

  main{position:relative;z-index:2;max-width:720px;margin:0 auto;padding:26px 20px 80px;}
  .greet{display:grid;grid-template-columns:auto 1fr;column-gap:14px;align-items:start;margin:8px 0 6px;}
  .gslot{width:1.15em;height:1.15em;font-size:clamp(22px,3.2vw,30px);margin-top:.03em}
  .greet h1{font-size:clamp(22px,3.2vw,30px);font-weight:800;letter-spacing:-.02em;line-height:1.2;margin:0}
  .hint{color:var(--muted);font-size:14px;margin:0 0 18px 0}
  .ro{font-size:12.5px;color:var(--muted);margin:0 0 14px}
  .sec{font-size:11.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px}
  .row{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:0 0 8px;overflow:hidden;opacity:0;transform:translateY(8px);transition:opacity .4s ease, transform .4s ease, box-shadow .2s;}
  .row.in{opacity:1;transform:none}
  .row .head{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:13px 16px;cursor:pointer;}
  .row .head:hover{background:color-mix(in srgb,var(--blue) 5%,transparent)}
  .row .q{font-size:13px;color:var(--muted);margin:0 0 2px}
  .row .a{font-size:15.5px;font-weight:600;margin:0;color:var(--ink);white-space:pre-wrap}
  .row .a.empty{color:var(--muted);font-weight:400;font-style:italic}
  .row .tick{font-size:12px;color:var(--green);font-weight:700;opacity:0;transition:opacity .3s} .row .tick.on{opacity:1}
  .row .edit{display:none;padding:4px 16px 14px;border-top:1px solid var(--line)}
  .row.open{box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 18%,transparent)} .row.open .edit{display:block} .row.open .head{cursor:default}
  .row.open .head{display:none}
  .edit .eq{display:grid;grid-template-columns:auto 1fr;column-gap:12px;align-items:start;margin:8px 0 12px}
  .edit .slot{width:1.15em;height:1.15em;font-size:clamp(18px,2.6vw,22px);margin-top:.05em}
  .edit .eq p{font-size:clamp(18px,2.6vw,22px);font-weight:800;letter-spacing:-.01em;margin:0;line-height:1.2}
  .edit input[type=text],.edit input[type=email],.edit input[type=number],.edit textarea{width:100%;font:inherit;font-size:16px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);outline:none}
  .edit textarea{min-height:90px;resize:none}
  .edit :is(input,textarea):focus{border-color:var(--blue);box-shadow:0 0 0 4px color-mix(in srgb,var(--blue) 15%,transparent)}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chips label{padding:9px 15px;border-radius:999px;background:var(--bg);color:var(--ink);border:1.5px solid var(--line);cursor:pointer;font-weight:600;font-size:14px}
  .chips label:hover{border-color:var(--blue)} .chips label:has(input:checked){background:var(--blue);color:#fff;border-color:var(--blue)}
  .chips input{position:absolute;opacity:0;pointer-events:none}
  .custom{margin-top:10px;max-width:240px} .custom[hidden]{display:none}
  .acts{display:flex;gap:16px;align-items:center;margin-top:12px;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
  .acts button{background:none;border:0;font:inherit;font-size:12px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;padding:6px 0;color:var(--muted)}
  .acts button.go{background:var(--blue);color:#fff;font-weight:700;letter-spacing:0;text-transform:none;font-size:14px;padding:9px 20px;border-radius:999px}
  .acts button.go:hover{filter:brightness(1.08)}
  .pick[disabled]{opacity:.6;cursor:default}
  .toast{position:fixed;left:50%;bottom:calc(64px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);z-index:60;background:var(--green);color:#fff;font-weight:700;font-size:14px;padding:10px 18px;border-radius:999px;box-shadow:0 6px 20px rgba(0,0,0,.18);opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;max-width:calc(100vw - 32px);text-align:center}
  .toast.on{opacity:1;transform:translate(-50%,0)}
  .err{font-size:13px;color:#fff;background:var(--err);display:inline-block;padding:4px 10px;border-radius:8px;margin-top:8px;opacity:0;transition:opacity .2s} .err.on{opacity:1}
  .pick{background:var(--blue);color:#fff;border:0;border-radius:999px;padding:10px 18px;font:inherit;font-weight:700;font-size:14px;cursor:pointer}
  .fhint{font-size:12.5px;color:var(--muted);margin-left:10px}
  .auth{max-width:420px;margin:60px auto;text-align:center;color:var(--muted)}
  .dlist{list-style:none;margin:0 0 12px;padding:0}
  .dlist li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14.5px}
  .dlist .dname{overflow-wrap:anywhere}
  .dlist .rm{background:none;border:0;font:inherit;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);cursor:pointer;padding:4px 0;white-space:nowrap}
  .dlist .rm:hover{color:var(--err)}
  .dlist li.gone .dname{text-decoration:line-through;opacity:.5}
  .dlist .tag{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--green);margin-left:6px}
  .staged{margin:10px 0 0;font-size:14.5px;font-weight:600}
  .acts button[disabled]{opacity:.6;cursor:default}
  /* Desktop (≥1024px): wider canvas; the profile sections flow in two balanced columns. */
  @media(min-width:1024px){
    main{max-width:1160px;padding:40px 40px 90px}
    .hint,.ro{max-width:760px}
    #rows{columns:2;column-gap:32px}
    .grp{break-inside:avoid;padding-top:1px;margin-bottom:26px}
    .grp .sec{margin-top:6px}
  }
</style>
</head>
<body>
<header><a class="brand" href="/">● JobsPulse</a><div class="hdr"><a class="hbtn" href="/dashboard/" data-i18n="nav.dashboard">Dashboard</a><select id="lang-switch" aria-label="Language"></select></div></header>
<div class="orb" id="orb"><div class="core" id="core"></div></div>
<main>
  <div class="auth" id="auth" hidden><p data-i18n="jv.signin"></p><p><a href="/dashboard/" data-i18n="nav.signin"></a></p></div>
  <div id="app" hidden>
    <div class="greet"><div class="gslot" id="gslot"></div><h1 id="title"></h1></div>
    <p class="hint" data-i18n="jv.edit_hint"></p>
    <p class="ro" id="ro"></p>
    <div id="rows"></div>
  </div>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/assets/i18n.js"></script>
<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
  const SUPABASE_URL = 'https://rkuiprrginjullnzskkg.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_jtWlWOLHLw-ebE0BcfHifA_D9PIQy8O';
  const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const T = k => (window.jpt ? window.jpt(k) : k);
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  // Same questions, options and normalisers as the intake (site/join-v2.html), keyed by column.
  const LANGS = [['en','English'],['es','Español'],['ca','Català'],['de','Deutsch'],['fr','Français'],['ja','日本語'],['zh','中文']];
  const TOWNS = ["Barcelona","Girona","Madrid","Blanes","Lloret de Mar","Tossa de Mar","Malgrat de Mar","Calella","Pineda de Mar","Arenys de Mar","Mataró","Figueres","Sabadell","Terrassa","Granollers","Vic","Manresa","Vilanova i la Geltrú","Reus","Tarragona","Sitges","Lleida","València","Sevilla","Bilbao","Zaragoza","Málaga","Palma","Alicante","Murcia","Sant Cugat del Vallès","Badalona","L'Hospitalet de Llobregat","Cornellà de Llobregat","Esplugues de Llobregat","Sant Just Desvern","Lliçà d'Amunt","Mollet del Vallès","Rubí","Castelldefels","Gavà","Viladecans","El Prat de Llobregat","Sant Boi de Llobregat","Cerdanyola del Vallès","Santa Coloma de Gramenet","Olot","Palamós","Palafrugell","Sant Feliu de Guíxols","Santa Coloma de Farners","Banyoles","Salt","Cardedeu","Martorell","Igualada","Vilafranca del Penedès","El Vendrell","Tortosa"];
  const SECTIONS = [
    ['in.sec.about', [
      {name:'first_name', type:'text', q:'jv.name', required:true, norm:'name'},
      {name:'language', type:'chips', q:'jv.lang', required:true, options:LANGS},
      {name:'role_title', type:'text', q:'jv.role', ph:'in.role_ph', required:true, norm:'title'},
      {name:'years_experience', type:'chips', q:'jv.years', required:true, options:[['0','jv.y_lt1'],['1','jv.y_1_2'],['3','jv.y_3_5'],['6','jv.y_6_9'],['10','jv.y_10']], snap:[0,1,3,6,10]},
    ]],
    ['jv.sec_docs', [
      {name:'cv', type:'cv', q:'jv.cvfile'},
      {name:'documents', type:'docs', q:'jv.files'},
    ]],
    ['in.sec.looking', [
      {name:'target_roles', type:'text', q:'jv.roles', ph:'in.roles_ph', required:true, norm:'list6'},
      {name:'skills', type:'text', q:'jv.skills', ph:'in.skills_ph', required:true, norm:'list12'},
      {name:'target_companies', type:'text', q:'jv.companies', ph:'in.companies_ph', norm:'list8'},
      {name:'learning_skills', type:'text', q:'jv.learning', ph:'in.learning_ph', norm:'list8'},
      {name:'salary_floor', type:'chips', q:'jv.salary', custom:'jv.s_other', options:[['','jv.s_none'],['€20,000','€20k'],['€25,000','€25k'],['€30,000','€30k'],['€40,000','€40k'],['€50,000','€50k']]},
      {name:'deal_breakers', type:'text', q:'jv.dealbreakers', ph:'in.dealbreakers_ph', norm:'trim'},
    ]],
    ['in.sec.logistics', [
      {name:'location', type:'town', q:'jv.location', ph:'in.location_ph', required:true, norm:'title'},
      {name:'work_style', type:'chips', q:'jv.workstyle', required:true, options:[['On-site','in.ws.onsite'],['Hybrid','in.ws.hybrid'],['Remote','in.ws.remote'],['No preference','in.ws.nopref']]},
      {name:'commute', type:'chips', q:'jv.commute', required:true, options:[['up to 30 min','jv.c_30'],['up to 1 hour','jv.c_60'],['up to 2 hours','jv.c_120'],['open to relocating','jv.c_reloc']], keepCurrent:true},
      {name:'work_authorization', type:'chips', q:'jv.workauth', required:true, options:[['EU — no sponsorship needed','in.wa.eu'],['Needs visa sponsorship','in.wa.visa'],['Remote only','in.wa.remote'],['Other / will explain','in.wa.other']]},
    ]],
    ['in.sec.howwork', [
      {name:'career_goal', type:'long', q:'jv.grow', ph:'in.grow_ph', norm:'trim'},
      {name:'energizers', type:'long', q:'jv.energize', ph:'in.energize_ph', norm:'trim'},
      {name:'thrive_environment', type:'long', q:'jv.thrive', ph:'in.thrive_ph', norm:'trim'},
      {name:'drains_energy', type:'long', q:'jv.drains', ph:'in.drains_ph', norm:'trim'},
      {name:'cv_or_linkedin', type:'long', q:'jv.cv', ph:'in.cvtext_ph', norm:'trim'},
    ]],
  ];
  const STEPS = SECTIONS.flatMap(s => s[1]);
  const list = (v, cap) => { const seen = {}, out = []; v.split(/[,;\n]+/).forEach(x => { x = x.trim().replace(/\s+/g,' ').replace(/^[-•·]\s*/,''); const k = x.toLowerCase(); if (x && !seen[k]) { seen[k] = 1; out.push(x); } }); return out.slice(0, cap).join(', '); };
  const NORM = { name: v => v.trim().replace(/\s+/g,' ').slice(0,80), title: v => v.trim().replace(/\s+/g,' ').slice(0,120), trim: v => v.trim().slice(0,600), list6: v => list(v,6), list8: v => list(v,8), list12: v => list(v,12) };

  const DEMO = new URLSearchParams(location.search).get('demo') === '1';  // design preview: sample data, no reads/writes
  let profile = null, email = '', cv = null, docs = [], openRow = null, pend = null;
  const kb = n => n >= 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB';
  const orb = $('orb'), core = $('core');
  const BASE = () => Math.min(Math.min(window.innerWidth, window.innerHeight) * 0.7, 560);
  function placeAt(el) {  // Dottie glides to (and scales to) a slot element
    if (!el) return; const r = el.getBoundingClientRect(), S = BASE();
    const dx = r.left + r.width/2 - window.innerWidth/2, dy = r.top + r.height/2 - window.innerHeight/2;
    orb.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(${r.width / S})`;
  }
  function placeHome(){ placeAt(openRow ? openRow.querySelector('.slot') : $('gslot')); }
  window.addEventListener('resize', placeHome); window.addEventListener('scroll', placeHome, {passive:true});
  if (window.ResizeObserver) new ResizeObserver(placeHome).observe(document.body);

  // ── display value for a row ──
  function display(s) {
    if (s.type === 'cv') return cv && cv.has_cv ? `${T('jv.cv_current')}${cv.name ? ' · ' + cv.name : ''}` : T('jv.cv_none');
    if (s.type === 'docs') return docs.length ? docs.map(d => d.name).join('\n') : T('jv.docs_none');
    const v = profile[s.name];
    if (v == null || v === '') return '';
    if (s.type === 'chips') { const o = s.options.find(o => String(o[0]) === String(v)); if (o) return o[1].includes('.') ? T(o[1]) : o[1]; if (s.name === 'years_experience') return String(v); return String(v); }
    return String(v);
  }
  function rowHtml(s) {
    const d = display(s);
    return `<div class="row" data-name="${s.name}"><div class="head"><div><p class="q">${esc(T(s.q))}</p><p class="a ${d ? '' : 'empty'}">${esc(d || T('jv.empty'))}</p></div><span class="tick">✓ ${esc(T('jv.saved'))}</span></div><div class="edit"></div></div>`;
  }
  function paint() {
    $('title').textContent = T('jv.edit_title').replace('{name}', profile.first_name || '');
    $('ro').textContent = T('jv.edit_email').replace('{email}', email);
    $('rows').innerHTML = SECTIONS.map(([sec, steps]) => `<section class="grp"><p class="sec">${esc(T(sec).replace(/<[^>]+>/g,''))}</p>` + steps.map(rowHtml).join('') + `</section>`).join('');
    document.querySelectorAll('.row').forEach((r, i) => { setTimeout(() => r.classList.add('in'), 40 + i * 35); r.querySelector('.head').onclick = () => open(r); });
    setTimeout(placeHome, 60);
  }

  // ── editing one row in place ──
  async function open(r) {
    if (openRow === r) return;
    if (openRow && !(await leave(openRow))) return;  // a change in progress is saved, not thrown away
    const s = STEPS.find(x => x.name === r.dataset.name); openRow = r; r.classList.add('open');
    const v = (s.type === 'cv' || s.type === 'docs') ? '' : (profile[s.name] ?? '');
    let ctl = '';
    const ph = s.ph ? esc(T(s.ph)) : '';
    if (s.type === 'text') ctl = `<input type="text" placeholder="${ph}" value="${esc(v)}">`;
    else if (s.type === 'town') ctl = `<input type="text" list="towns" autocomplete="off" placeholder="${ph}" value="${esc(v)}"><datalist id="towns">${TOWNS.map(t => `<option value="${esc(t)}">`).join('')}</datalist>`;
    else if (s.type === 'long') ctl = `<textarea placeholder="${ph}">${esc(v)}</textarea>`;
    else if (s.type === 'chips') {
      let cur = String(v ?? '');
      if (s.snap && cur !== '') { const n = parseInt(cur, 10); cur = String(s.snap.reduce((a, b) => Math.abs(b - n) <= Math.abs(a - n) ? b : a)); }
      const known = s.options.some(o => String(o[0]) === cur);
      const isCustom = !!s.custom && cur !== '' && !known;
      ctl = `<div class="chips">` + s.options.map(o => `<label><input type="radio" name="c" value="${esc(o[0])}" ${String(o[0]) === cur ? 'checked' : ''}>${o[1].includes('.') ? esc(T(o[1])) : esc(o[1])}</label>`).join('')
        + (s.keepCurrent && cur && !known ? `<label><input type="radio" name="c" value="${esc(cur)}" checked>${esc(cur)}</label>` : '')
        + (s.custom ? `<label><input type="radio" name="c" value="__custom" ${isCustom ? 'checked' : ''}>${esc(T(s.custom))}</label>` : '') + `</div>`
        + (s.custom ? `<div class="custom" ${isCustom ? '' : 'hidden'}><input type="number" min="0" step="1000" placeholder="${esc(T('jv.s_other_ph'))}" value="${isCustom ? cur.replace(/[^0-9]/g,'') : ''}"></div>` : '');
    } else if (s.type === 'cv') ctl = `<button type="button" class="pick">${esc(T('jv.cv_replace'))}</button><span class="fhint">${esc(T('jv.cvfile_hint'))}</span><p class="staged" hidden></p><input type="file" accept=".pdf,.doc,.docx,.png,.jpg,.jpeg" hidden>`;
    else if (s.type === 'docs') ctl = `<ul class="dlist"></ul><button type="button" class="pick">${esc(T('jv.docs_add'))}</button><span class="fhint">${esc(T('jv.cvfile_hint'))}</span><input type="file" multiple accept=".pdf,.doc,.docx,.png,.jpg,.jpeg" hidden>`;
    r.querySelector('.edit').innerHTML = `<div class="eq"><div class="slot"></div><p>${esc(T(s.q))}</p></div>${ctl}<div class="err"></div><div class="acts"><button type="button" class="go">${esc(T('jv.save'))}</button><button type="button" class="cancel">${esc(T('jv.cancel'))}</button></div>`;
    const e = r.querySelector('.edit');
    e.querySelector('.cancel').onclick = () => close(r);
    e.querySelector('.go').onclick = () => save(r, s);
    e.querySelectorAll('input[type=radio]').forEach(x => x.onchange = () => { const c = e.querySelector('.custom'); if (c) { c.hidden = x.value !== '__custom'; if (!c.hidden) c.querySelector('input').focus(); } });
    // CV + documents are STAGED: picking a file or tapping remove changes nothing until Save.
    pend = { cv: null, add: [], remove: new Set() };
    if (s.type === 'cv') { const inp = e.querySelector('input[type=file]'); e.querySelector('.pick').onclick = () => inp.click();
      inp.onchange = () => { const f = inp.files[0]; inp.value = ''; if (!f) return; pend.cv = f; r.querySelector('.err').classList.remove('on');
        const st = e.querySelector('.staged'); st.hidden = false; st.textContent = '📄 ' + T('jv.cv_selected').replace('{name}', `${f.name} (${kb(f.size)})`); }; }
    if (s.type === 'docs') { const inp = e.querySelector('input[type=file]'); e.querySelector('.pick').onclick = () => inp.click();
      inp.onchange = () => { pend.add.push(...inp.files); inp.value = ''; r.querySelector('.err').classList.remove('on'); paintDocs(r); }; paintDocs(r); }
    e.addEventListener('keydown', ev => { if (ev.key === 'Enter' && !(ev.shiftKey && s.type === 'long') && ev.target.tagName !== 'BUTTON' && s.type !== 'long') { ev.preventDefault(); save(r, s); } if (ev.key === 'Escape') close(r); });
    // bring the row into view, then let Dottie glide to it and focus the control
    r.scrollIntoView({ behavior: 'smooth', block: 'center' });
    core.classList.remove('happy'); void core.offsetWidth; placeHome();
    setTimeout(() => { placeHome(); const f = e.querySelector('input[type=text],input[type=number],textarea'); if (f) f.focus({ preventScroll: true }); }, 450);
  }
  function close(r) { if (openRow === r) pend = null; r.classList.remove('open'); r.querySelector('.edit').innerHTML = ''; if (openRow === r) openRow = null; placeHome(); }
  function fail(r, msg) { const e = r.querySelector('.err'); e.textContent = msg; e.classList.add('on'); }
  // The value currently in an open row's control → { val } or { err }.
  function readVal(r, s) {
    const e = r.querySelector('.edit'); let val;
    if (s.type === 'chips') {
      const sel = e.querySelector('input[type=radio]:checked'); val = sel ? sel.value : null;
      if (val === '__custom') { const n = parseInt(e.querySelector('.custom input').value, 10); if (!n || n <= 0) return { err: T('jv.err_required') }; val = '€' + n.toLocaleString('en-US'); }
      if (s.required && val == null) return { err: T('jv.err_required') };
      if (s.name === 'years_experience' && val != null) val = parseInt(val, 10);
      if (val === '') val = null;
    } else {
      val = (e.querySelector('input,textarea').value || '').trim(); if (s.norm) val = NORM[s.norm](val);
      if (s.required && !val) return { err: T('jv.err_required') };
      if (!val) val = null;
    }
    return { val };
  }
  const same = (a, b) => String(a ?? '') === String(b ?? '');
  async function save(r, s) {
    if (s.type === 'cv') return saveCv(r);
    if (s.type === 'docs') return saveDocs(r);
    const { val, err } = readVal(r, s);
    if (err) { fail(r, err); return false; }
    if (same(val, profile[s.name])) { close(r); return true; }  // nothing changed
    orb.classList.add('thinking');
    const { error } = DEMO ? { error: null } : await sb.from('profiles').update({ [s.name]: val }).eq('id', profile.id);
    orb.classList.remove('thinking');
    if (error) { fail(r, error.message); return false; }
    profile[s.name] = val;
    if (s.name === 'language') { const sel = $('lang-switch'); if (sel) { sel.value = val; sel.dispatchEvent(new Event('change', {bubbles:true})); } }
    done(r, s); toast(T('jv.toast_saved'));
    return true;
  }
  // Leaving an open row (another row tapped, or a click outside) saves its change — fields and
  // staged files alike; Cancel / Esc are the only ways to discard.
  async function leave(r) { return save(r, STEPS.find(x => x.name === r.dataset.name)); }
  document.addEventListener('click', ev => {
    // composedPath() is captured at dispatch, so it still holds the row even when the click
    // re-rendered (detached) its own target — e.g. a document's remove/undo button.
    const path = ev.composedPath();
    if (!openRow || path.some(n => n.classList && (n.classList.contains('row') || n.tagName === 'SELECT'))) return;
    leave(openRow);
  });
  let toastT = null;
  function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2800); }
  function busyBtn(r, on) {  // the Save button shows progress while files go up
    const g = r.querySelector('.go'); g.disabled = on; g.textContent = T(on ? 'jv.uploading' : 'jv.save');
    r.querySelectorAll('.pick,.cancel').forEach(b => b.disabled = on); orb.classList.toggle('thinking', on);
  }
  async function saveCv(r) {
    if (!pend || !pend.cv) { close(r); return true; }
    const file = pend.cv, fd = new FormData(); fd.append('action', 'upload_cv'); fd.append('file', file);
    r.querySelector('.err').classList.remove('on'); busyBtn(r, true);
    const { ok, j } = await api(fd);
    busyBtn(r, false);
    if (!ok) { fail(r, T('jv.err_file').replace('{name}', file.name)); return false; }
    cv = { has_cv: true, name: j.name || file.name }; done(r, STEPS.find(x => x.name === 'cv'));
    toast(T('jv.toast_cv').replace('{name}', cv.name));
    return true;
  }
  async function api(body) {  // signed-in call to the profile edge fn (JSON or FormData)
    if (DEMO) { await new Promise(r => setTimeout(r, 500)); const f = body instanceof FormData ? body.get('file') : null;
      const n = f ? f.name.replace(/[^a-zA-Z0-9._-]/g, '_') : ''; return { ok: true, status: 200, j: { ok: true, key: 'doc-' + Date.now() + '-' + n, name: n } }; }
    const { data: { session } } = await sb.auth.getSession();
    const h = { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + session.access_token };
    if (!(body instanceof FormData)) { h['Content-Type'] = 'application/json'; body = JSON.stringify(body); }
    const res = await fetch(SUPABASE_URL + '/functions/v1/profile', { method: 'POST', headers: h, body });
    return { ok: res.ok, status: res.status, j: await res.json().catch(() => ({})) };
  }
  // ── other documents: current files (tap remove → struck through, undo) + newly picked files
  //    (marked "new"); nothing is uploaded or deleted until Save ──
  function paintDocs(r) {
    const ul = r.querySelector('.dlist'); if (!ul || !pend) return;
    ul.innerHTML = docs.map(d => { const gone = pend.remove.has(d.key);
        return `<li class="${gone ? 'gone' : ''}"><span class="dname">📄 ${esc(d.name)}</span><button type="button" class="rm" data-key="${esc(d.key)}">${esc(T(gone ? 'jv.docs_undo' : 'jv.docs_remove'))}</button></li>`; }).join('')
      + pend.add.map((f, k) => `<li class="new"><span class="dname">📄 ${esc(f.name)} <span class="tag">${esc(T('jv.docs_new'))}</span></span><button type="button" class="rm" data-add="${k}">${esc(T('jv.docs_remove'))}</button></li>`).join('');
    ul.querySelectorAll('.rm').forEach(b => b.onclick = () => {
      if (b.dataset.add != null) pend.add.splice(+b.dataset.add, 1);
      else if (pend.remove.has(b.dataset.key)) pend.remove.delete(b.dataset.key); else pend.remove.add(b.dataset.key);
      paintDocs(r);
    });
  }
  async function saveDocs(r) {
    if (!pend || (!pend.add.length && !pend.remove.size)) { close(r); return true; }
    r.querySelector('.err').classList.remove('on'); busyBtn(r, true);
    const failed = [];
    for (const f of pend.add.slice()) {
      const fd = new FormData(); fd.append('action', 'upload_doc'); fd.append('file', f);
      const { ok, j } = await api(fd);
      if (!ok) { failed.push(f.name); continue; }
      docs.unshift({ key: j.key, name: j.name, uploaded_at: new Date().toISOString() }); pend.add.splice(pend.add.indexOf(f), 1);
    }
    for (const key of [...pend.remove]) {
      const { ok } = await api({ action: 'delete_doc', key });
      if (!ok) { failed.push((docs.find(d => d.key === key) || {}).name || key); continue; }
      docs = docs.filter(d => d.key !== key); pend.remove.delete(key);
    }
    busyBtn(r, false);
    if (failed.length) { paintDocs(r); fail(r, T('jv.err_file').replace('{name}', failed.join(', '))); return false; }
    done(r, STEPS.find(x => x.name === 'documents')); toast(T('jv.toast_docs'));
    return true;
  }
  function pop(r) {
    const t = r.querySelector('.tick'); t.classList.add('on'); setTimeout(() => t.classList.remove('on'), 2200);
    core.classList.remove('happy'); void core.offsetWidth; core.classList.add('happy');
  }
  function done(r, s) {
    close(r);
    const d = display(s); const a = r.querySelector('.a'); a.textContent = d || T('jv.empty'); a.classList.toggle('empty', !d);
    const t = r.querySelector('.tick'); t.classList.add('on'); setTimeout(() => t.classList.remove('on'), 2200);
    core.classList.remove('happy'); void core.offsetWidth; core.classList.add('happy');
  }

  async function init() {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { $('auth').hidden = false; return; }
    email = session.user.email;
    const { data: prof } = await sb.from('profiles').select('*').eq('email', session.user.email.toLowerCase()).limit(1).maybeSingle();  // own row only — admins can read every row
    if (!prof) { $('auth').hidden = false; return; }
    profile = prof; $('app').hidden = false;
    setTimeout(() => placeHome(), 80);
    try {
      const { ok, j } = await api({ action: 'docs_status' });
      if (ok) { cv = j.cv ? { has_cv: true, name: j.cv.name } : { has_cv: false }; docs = j.docs || []; }
    } catch (e) { cv = null; }
    paint();
  }
  document.addEventListener('jp:lang', () => { if (profile) { const o = openRow && openRow.dataset.name; paint(); if (o) open(document.querySelector(`.row[data-name="${o}"]`)); } });
  // preview hook: ?demo=1 renders a sample profile with no session — for design review; reads
  // and writes nothing from the database
  function previewBanner(){ var b=document.createElement('div'); b.setAttribute('data-i18n','jv.preview'); b.textContent=(window.jpt?window.jpt('jv.preview'):'Preview'); b.style.cssText='position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;background:#14202b;color:#fff;font:600 12.5px/1.3 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:8px 14px;border-radius:999px;box-shadow:0 4px 16px rgba(0,0,0,.2);pointer-events:none;max-width:calc(100vw - 32px);text-align:center'; document.body.appendChild(b); }
  if (DEMO) {
    previewBanner();
    profile = { id: 'demo', first_name: 'Albert', language: 'ca', role_title: 'Agentic AI Engineer', years_experience: 3, target_roles: 'Data Analyst, Analytics Engineer, AI Engineer', skills: 'Python, SQL, JavaScript, LLMs, RAG', target_companies: 'Apple, IBM, Amazon, Google', learning_skills: '', salary_floor: '€35,000', deal_breakers: '', location: 'Barcelona', work_style: 'Hybrid', commute: 'up to 1 hour', work_authorization: 'EU — no sponsorship needed', career_goal: 'Grow into a lead role', energizers: 'Building things', thrive_environment: '', drains_energy: 'Unclear priorities', cv_or_linkedin: '' };
    email = 'albert@example.com'; cv = { has_cv: true, name: 'cv_albert.pdf' }; docs = [{ key: 'doc-1-cover_letter.pdf', name: 'cover_letter.pdf' }, { key: 'doc-2-aws_certificate.pdf', name: 'aws_certificate.pdf' }]; $('app').hidden = false; paint();
  } else init();
</script>
