<!doctype html>
<html lang="en" data-i18n-title="fb.title">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="robots" content="noindex">
<title>JobsPulse — your feedback</title>
<meta name="description" content="Tell us what's working and what's missing in the JobsPulse beta.">
<style>
  :root{ --blue:#0b5cad; --blue-d:#094a8c; --ink:#14202b; --muted:#5a6b7b; --bg:#f4f6f9; --card:#fff; --line:#e3e8ee; }
  @media (prefers-color-scheme: dark){
    :root{ --ink:#eef3f8; --muted:#9fb0c0; --bg:#0e151c; --card:#161f29; --line:#26323f; --blue:#3a90e0; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased;}
  a{color:var(--blue);}
  .wrap{max-width:620px;margin:0 auto;padding:0 22px 60px;}
  nav{display:flex;align-items:center;justify-content:space-between;padding:20px 0;flex-wrap:nowrap;gap:10px;}
  .logo{display:inline-flex;align-items:center;flex:0 0 auto;gap:9px;font-weight:800;font-size:19px;color:var(--blue);text-decoration:none;}
  .links{display:flex;align-items:center;flex-wrap:nowrap;}
  .dot{width:11px;height:11px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 5px color-mix(in srgb,var(--blue) 18%,transparent);}
  nav .links a{font-size:14px;font-weight:600;margin-left:16px;text-decoration:none;color:var(--ink);white-space:nowrap;}
  nav .links a:hover{color:var(--blue);}
  @media(max-width:430px){
    nav{gap:6px;}
    .logo{font-size:16px;gap:7px;}
    nav .links a{font-size:13px;margin-left:8px;}
  }
  @media(max-width:360px){
    .logo{font-size:15px;}
    nav .links a{font-size:12px;margin-left:6px;}
  }
  h1{font-size:30px;line-height:1.14;margin:20px 0 8px;letter-spacing:-.02em;}
  .lede{font-size:17px;color:var(--muted);margin:0 0 24px;}
  label{display:block;font-weight:600;font-size:14.5px;margin:20px 0 8px;}
  textarea,input[type=email]{width:100%;padding:12px 14px;font-size:15px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-family:inherit;}
  textarea{min-height:84px;resize:vertical;}
  .scale{display:flex;gap:8px;flex-wrap:wrap;}
  .scale label{margin:0;font-weight:500;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:9px;padding:9px 13px;cursor:pointer;font-size:14px;background:var(--card);}
  .scale input{accent-color:var(--blue);}
  .btn{margin-top:22px;width:100%;padding:14px;font-size:16px;font-weight:600;border:0;border-radius:10px;background:var(--blue);color:#fff;cursor:pointer;}
  .btn:hover{background:var(--blue-d);} .btn[disabled]{opacity:.6;cursor:default;}
  #note{font-size:13.5px;color:var(--muted);margin-top:12px;}
  .hp{position:absolute;left:-9999px;}
  footer{padding:34px 0 0;color:var(--muted);font-size:13px;}
  #done{display:none;text-align:center;padding:40px 10px;}
  #done .tick{width:60px;height:60px;border-radius:50%;background:#1a7f37;color:#fff;font-size:32px;line-height:60px;margin:0 auto 16px;}
  .footrow{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;}
  #lang-switch{font:inherit;font-size:13px;color:var(--muted);background:var(--card);
    border:1px solid var(--line);border-radius:8px;padding:5px 8px;cursor:pointer;}
</style>
</head>
<body>
<div class="wrap">
  <nav>
    <a class="logo" href="/"><span class="dot"></span>JobsPulse</a>
    <div class="links"><a href="/how-it-works/" data-i18n="nav.how">How it works</a><a href="/pricing/" data-i18n="nav.pricing">Pricing</a></div>
  </nav>

  <div id="form-wrap">
    <h1 data-i18n="fb.h1">How's JobsPulse working for you?</h1>
    <p class="lede" data-i18n="fb.lede">You're one of the first to test it — your honest take shapes what it becomes.
      Two minutes, hugely appreciated.</p>

    <!-- SETUP: create a Formspree form (formspree.io) and paste its id in place of YOUR_FEEDBACK_ID -->
    <form id="fb" action="https://formspree.io/f/YOUR_FEEDBACK_ID" method="post">
      <input type="text" name="_gotcha" class="hp" tabindex="-1" autocomplete="off">

      <label data-i18n="fb.q1">How useful were your matches?</label>
      <div class="scale">
        <label><input type="radio" name="usefulness" value="1"><span data-i18n="fb.scale1">1 · not useful</span></label>
        <label><input type="radio" name="usefulness" value="2">2</label>
        <label><input type="radio" name="usefulness" value="3">3</label>
        <label><input type="radio" name="usefulness" value="4">4</label>
        <label><input type="radio" name="usefulness" value="5"><span data-i18n="fb.scale5">5 · very useful</span></label>
      </div>

      <label data-i18n="fb.easy">Was it easy to use?</label>
      <div class="scale">
        <label><input type="radio" name="easy" value="yes"><span data-i18n="fb.easyyes">Yes</span></label>
        <label><input type="radio" name="easy" value="somewhat"><span data-i18n="fb.easysome">Somewhat</span></label>
        <label><input type="radio" name="easy" value="no"><span data-i18n="fb.easyno">No</span></label>
      </div>

      <label data-i18n="fb.format">Did you prefer getting matches by email over a web dashboard?</label>
      <div class="scale">
        <label><input type="radio" name="format_pref" value="email"><span data-i18n="fb.fmtemail">Email</span></label>
        <label><input type="radio" name="format_pref" value="web"><span data-i18n="fb.fmtweb">Web dashboard</span></label>
        <label><input type="radio" name="format_pref" value="no_pref"><span data-i18n="fb.fmtnopref">No preference</span></label>
      </div>

      <label data-i18n="fb.q2">What did you like most?</label>
      <textarea name="liked" data-i18n-ph="fb.q2ph" placeholder="The gap analysis, the scoring, the honesty…"></textarea>

      <label data-i18n="fb.q3">What would you change or add?</label>
      <textarea name="change" data-i18n-ph="fb.q3ph" placeholder="More roles, better fit, other job sources, tone…"></textarea>

      <label data-i18n="fb.q4">Would you pay $1/month for premium (weekly + dashboard + tailored CV &amp; cover letter)?</label>
      <div class="scale">
        <label><input type="radio" name="would_pay" value="yes"><span data-i18n="fb.payyes">Yes</span></label>
        <label><input type="radio" name="would_pay" value="maybe"><span data-i18n="fb.paymaybe">Maybe</span></label>
        <label><input type="radio" name="would_pay" value="no"><span data-i18n="fb.payno">No</span></label>
      </div>

      <label data-i18n="fb.q5">Anything else? <span style="font-weight:400;color:var(--muted)">(optional)</span></label>
      <textarea name="other" data-i18n-ph="fb.q5ph" placeholder="Bugs, ideas, first impressions…"></textarea>

      <label data-i18n="fb.email">Your email <span style="font-weight:400;color:var(--muted)">(optional — only if you'd like a reply)</span></label>
      <input type="email" name="email" data-i18n-ph="fb.emailph" placeholder="you@email.com" autocomplete="email">

      <button class="btn" id="submit" type="submit" data-i18n="fb.submit">Send feedback</button>
      <div id="note"></div>
    </form>
  </div>

  <div id="done">
    <div class="tick">&#10003;</div>
    <h1 data-i18n="fb.doneh">Thank you 🙏</h1>
    <p class="lede" data-i18n="fb.donep">That genuinely helps. <a href="/">Back to JobsPulse</a></p>
  </div>

  <footer>
    <div class="footrow">
      <div>
        <a href="/how-it-works/" data-i18n="footer.how">How it works</a> &middot; <a href="/pricing/" data-i18n="footer.pricing">Pricing</a> &middot;
        <a href="/privacy/" data-i18n="footer.privacy">Privacy</a> &middot; <a href="mailto:privacy@jobspulseapp.com" data-i18n="footer.contact">Get in touch</a>
      </div>
      <select id="lang-switch" data-i18n-aria="lang.label" aria-label="Language"></select>
    </div>
  </footer>
</div>
<script src="/assets/i18n.js" defer></script>

<script>
  var form = document.getElementById('fb'), note = document.getElementById('note'), btn = document.getElementById('submit');
  form.addEventListener('submit', async function(e){
    e.preventDefault();
    if (this.action.indexOf('YOUR_FEEDBACK_ID') !== -1){
      document.getElementById('form-wrap').style.display='none';
      document.getElementById('done').style.display='block'; window.scrollTo(0,0);
      return; // demo mode until the Formspree id is set
    }
    btn.disabled = true; note.textContent = 'Sending…';
    try {
      var res = await fetch(this.action, { method:'POST', body:new FormData(this), headers:{'Accept':'application/json'} });
      if (res.ok){ document.getElementById('form-wrap').style.display='none'; document.getElementById('done').style.display='block'; window.scrollTo(0,0); }
      else { btn.disabled = false; note.textContent = "Hmm, that didn't send — email me directly instead."; }
    } catch(_) { btn.disabled = false; note.textContent = 'Network hiccup — try again in a moment.'; }
  });
</script>
</body>
</html>
